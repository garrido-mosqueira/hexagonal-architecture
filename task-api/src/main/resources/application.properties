server.port=8080
spring.application.name=challenge-java

management.endpoint.prometheus.enabled=true
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
management.metrics.tags.application=${spring.application.name}

delete.expired.task.scheduled = 0 0/5 * * * *

spring.mongodb.uri=mongodb://mongodb-challenge:27017/test
#spring.mongodb.uri=mongodb://localhost:27017/test

spring.data.redis.url=redis://redis-challenge:6379
#spring.data.redis.url=redis://localhost:6379
